plugins {
    id 'com.android.application'
}

// The launcher icon comes from the shared app icon (assets/app-icon), copied at build time so
// the repository keeps one copy of it.
def iconRes = layout.buildDirectory.dir("generated/icon-res")
def copyIcon = tasks.register('copyLauncherIcon', Copy) {
    from(rootProject.file('../../../assets/app-icon/hicolor/512x512/apps/ai.storyteller.photocraft.png'))
    into(iconRes.map { it.dir('mipmap-xxxhdpi') })
    rename { 'ic_launcher.png' }
}
// The adaptive icon's foreground (res/mipmap-anydpi-v26/ic_launcher.xml), from the same logo.
def copyIconForeground = tasks.register('copyLauncherIconForeground', Copy) {
    from(rootProject.file('../../../assets/app-icon/android/ic_launcher_foreground.png'))
    into(iconRes.map { it.dir('mipmap-xxxhdpi') })
}

// PIRA's version is the PIRA_VERSION file at the repository root ("0.2.0-beta", "0.2.0-beta.2",
// "0.2.0"), the same one the desktop builds and the release tag (v<version>) use. APP_VERSION
// overrides it for a one-off build. The updater (Updater.java) compares these names.
// versionCode must grow with every release Android should accept as an update:
// (major*10000 + minor*100 + patch)*100, plus the beta number for a beta (1 to 98) or 99 for the
// release itself, so 0.2.0-beta < 0.2.0-beta.2 < 0.2.0 < 0.2.1-beta.
def appVersionName = (System.getenv('APP_VERSION') ?: rootProject.file('../../../PIRA_VERSION').text).trim()
def versionParts = (appVersionName =~ /^(\d+)\.(\d+)\.(\d+)(?:-beta(?:\.(\d+))?)?$/)
if (!versionParts.matches()) {
    throw new GradleException("PIRA_VERSION must look like 0.2.0, 0.2.0-beta or 0.2.0-beta.2, not '${appVersionName}'")
}
def isBeta = appVersionName.contains('-beta')
def betaNumber = versionParts[0][4] ? versionParts[0][4].toInteger() : 1
if (isBeta && (betaNumber < 1 || betaNumber > 98)) {
    throw new GradleException("A beta number must be 1 to 98, not ${betaNumber}")
}
def appVersionCode = (versionParts[0][1].toInteger() * 10000 + versionParts[0][2].toInteger() * 100 + versionParts[0][3].toInteger()) * 100 + (isBeta ? betaNumber : 99)

// Release signing. The key lives outside the repository: a properties file (PIRA_SIGNING, or
// ~/pira-signing/keystore.properties by default) with storeFile and keyAlias, and the password
// in it or in PIRA_KEY_PASSWORD. Without the file the APK is signed with the debug key, which is
// fine on your own devices but must never be published: Android only installs an update signed
// with the same key as the installed copy. PIRA_RELEASE=1 makes a missing key an error.
def signingFile = file(System.getenv('PIRA_SIGNING') ?: "${System.getProperty('user.home')}/pira-signing/keystore.properties")
def signingProps = new Properties()
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
} else if (System.getenv('PIRA_RELEASE') == '1') {
    throw new GradleException("PIRA_RELEASE=1 but there is no signing key at ${signingFile} (see apps/photocraft-android/README.md, Release signing)")
}
def signingPassword = System.getenv('PIRA_KEY_PASSWORD') ?: signingProps.getProperty('password')

android {
    namespace 'ai.storyteller.photocraft'
    compileSdk 35

    defaultConfig {
        // PIRA's own id, so it installs beside PhotoCraft. The Java package (namespace) stays
        // ai.storyteller.photocraft: the JNI pen hook in crates/tablet is bound to it by name.
        applicationId 'art.pira'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName + '-android'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signingProps.getProperty('storeFile'))
                keyAlias signingProps.getProperty('keyAlias', 'pira')
                storePassword signingPassword
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        release {
            // GameActivity calls into Java by name from native code: keep every class as is.
            minifyEnabled false
            signingConfig signingFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            res.srcDirs += iconRes
        }
    }

    packaging {
        jniLibs {
            // Store the library uncompressed and page-aligned: loaded straight from the APK.
            useLegacyPackaging = false
        }
    }
}

tasks.named('preBuild') { dependsOn copyIcon, copyIconForeground }
logger.lifecycle(signingFile.exists() ? "Signing the release APK with the release key (${signingFile})" : 'Signing the release APK with the DEBUG key: for your own devices only, never publish it')

dependencies {
    // AndroidX pulls kotlin-stdlib 1.8 next to the old split -jdk7/-jdk8 artifacts; align them.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    // The Java half of GameActivity; android-activity (Rust) provides the native glue, so no
    // prefab. The version must match android-activity's (see its README).
    implementation 'androidx.games:games-activity:4.4.0'
    // Low-latency ink (Touch Input): the stroke being drawn goes to a front-buffered layer.
    implementation 'androidx.graphics:graphics-core:1.0.2'
}
