plugins {
    id 'com.android.application'
}

// The app version is the Cargo package's, plus the Android build number (RELEASE_BUILD, from
// build-android.sh) for repeat builds of one version: 0.1.0 build 3 is "0.1.0-3", versionCode
// 10003 (versionCode must grow with every build Android should accept as an update).
def cargoVersion = (rootProject.file('../Cargo.toml').text =~ /(?m)^version = "(\d+)\.(\d+)\.(\d+)"/)[0]
def releaseBuild = (System.getenv('RELEASE_BUILD') ?: '0').toInteger()
def appVersionName = "${cargoVersion[1]}.${cargoVersion[2]}.${cargoVersion[3]}" + (releaseBuild > 0 ? "-${releaseBuild}" : '')
def appVersionCode = (cargoVersion[1].toInteger() * 10000 + cargoVersion[2].toInteger() * 100 + cargoVersion[3].toInteger()) * 100 + Math.min(releaseBuild, 99)

// Release signing, as PIRA does it: a properties file (PIRA_SIGNING, or
// ~/pira-signing/keystore.properties by default) with storeFile and keyAlias, and the password in
// it or in PIRA_KEY_PASSWORD. Without it the APK is signed with the debug key: fine on your own
// devices, never to be published (Android only installs an update signed with the same key).
def signingFile = file(System.getenv('PIRA_SIGNING') ?: "${System.getProperty('user.home')}/pira-signing/keystore.properties")
def signingProps = new Properties()
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
} else if (System.getenv('PIRA_RELEASE') == '1') {
    throw new GradleException("PIRA_RELEASE=1 but there is no signing key at ${signingFile}")
}
def signingPassword = System.getenv('PIRA_KEY_PASSWORD') ?: signingProps.getProperty('password')

android {
    namespace 'art.pira.pose'
    compileSdk 35

    defaultConfig {
        applicationId 'art.pira.pose'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName + '-android'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signingProps.getProperty('storeFile'))
                keyAlias signingProps.getProperty('keyAlias', 'pira')
                storePassword signingPassword
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        release {
            // GameActivity calls into Java by name from native code: keep every class as is.
            minifyEnabled false
            signingConfig signingFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Store the library uncompressed and page-aligned: loaded straight from the APK.
            useLegacyPackaging = false
        }
    }
}

logger.lifecycle(signingFile.exists() ? "Signing the release APK with the release key (${signingFile})" : 'Signing the release APK with the DEBUG key: for your own devices only, never publish it')

dependencies {
    // AndroidX pulls kotlin-stdlib 1.8 next to the old split -jdk7/-jdk8 artifacts; align them.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    // The Java half of GameActivity; android-activity (Rust) provides the native glue. The
    // version must match android-activity's (see its README), as in PIRA.
    implementation 'androidx.games:games-activity:4.4.0'
}
