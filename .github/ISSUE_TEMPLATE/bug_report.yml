name: Bug report
description: Something in PIRA or PIRA Pose doesn't work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. PIRA is in beta, so this helps a lot.
        The [troubleshooting page](https://pira-art.com/wiki/Troubleshooting-and-FAQ.html) covers a few common problems.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - PIRA
        - PIRA Pose
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots or a short video help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a new canvas
        2. Pick the Pencil
        3. ...
  - type: input
    id: version
    attributes:
      label: Version
      description: Help › About in PIRA, or the release you downloaded.
      placeholder: e.g. 0.2.0-beta
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Android
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and system version
      placeholder: e.g. Samsung Galaxy Tab S9, Android 14 / Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: input
    attributes:
      label: Pen, tablet or other input (if it matters)
      placeholder: e.g. S Pen, Wacom Intuos (Windows Ink or WinTab), XP-Pen, mouse, finger
