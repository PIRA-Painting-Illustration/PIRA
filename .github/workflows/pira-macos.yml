name: PIRA macOS build

# Builds PIRA for macOS (one universal app for Apple silicon and Intel) and attaches it to an
# existing GitHub release. Started by hand from the Actions tab; nothing runs on push.
# The app is ad-hoc signed, not notarized: on first launch macOS asks to confirm it
# (right-click > Open, or System Settings > Privacy & Security > Open Anyway).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the build to, e.g. android-v0.1.0-5"
        type: string
        required: true
      version:
        description: "Version in the file name, e.g. 0.1.0-5"
        type: string
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build
        run: cargo build --release --locked -p photocraft --bins --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Make PIRA.app
        run: |
          set -euo pipefail
          APP=dist/PIRA.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/PIRA" \
            target/aarch64-apple-darwin/release/photocraft target/x86_64-apple-darwin/release/photocraft
          cp assets/app-icon/photocraft.icns "$APP/Contents/Resources/PIRA.icns"
          cp LICENSE-MIT LICENSE-APACHE NOTICE "$APP/Contents/Resources/"
          SHORT="${VERSION%%-*}"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleDisplayName</key><string>PIRA</string>
            <key>CFBundleName</key><string>PIRA</string>
            <key>CFBundleExecutable</key><string>PIRA</string>
            <key>CFBundleIdentifier</key><string>art.pira.desktop</string>
            <key>CFBundleIconFile</key><string>PIRA</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${SHORT}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.graphics-design</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          (cd dist && ditto -c -k --keepParent PIRA.app "pira-$VERSION-macos-universal.zip")
          lipo -info "$APP/Contents/MacOS/PIRA"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "dist/pira-$VERSION-macos-universal.zip" --clobber
